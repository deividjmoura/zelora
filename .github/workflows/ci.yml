name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: zelora
          POSTGRES_PASSWORD: zelora_ci
          POSTGRES_DB: zelora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zelora -d zelora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run API tests
        run: npm run test:api
        env:
          TEST_DATABASE_URL: postgres://zelora:zelora_ci@localhost:5432/zelora_test
